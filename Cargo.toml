[package]
name = "rfm-bin" # someone else already registered rfm as a crate-name :S
version = "0.4.3"
edition = "2021"
authors = ["Christian Hammermeister <christian.hammermeister@protonmail.com>"]
description = "A super fast file-manager written in rust"
repository = "https://github.com/dsxmachina/rfm"
keywords = ["filemanager", "ranger", "vifm", "terminal"]
categories = ["command-line-utilities", "filesystem"]
license = "GPL-3.0"

[[bin]]
name = "rfm"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
ab_glyph = "0.2"
anyhow = "1.0.95"
cached = "0.42.0"
clap = {version = "4.5.26", features = ["derive"]}
crossterm = { version = "0.26.1", features = ["event-stream"] }
seahash = "4.1.0"
flate2 = "1"
fs_extra = "1.3.0"
futures = "0.3.31"
image = "0.24.9"
# content sniffing (magic numbers) for get_mime_type; its cfb dep pulls
# uuid, whose newest versions need rustc >=1.85 - pinned to 1.12.1 in
# Cargo.lock.
infer = "0.22"
log = { version ="0.4.22", features = ["std"] }
# lofty 0.22.3 bumps MSRV to 1.85; cap below it (its ogg_pager dep 0.7.1
# does too - pinned to 0.7.0 in Cargo.lock).
lofty = ">=0.22, <0.22.3"
mime = "0.3.17"
mime_guess = "2.0.5"
notify = "8.0.0"
once_cell = { version = "1.20.2", features = ["parking_lot"] }
opener = "0.7.2"
parking_lot = "0.12.3"
patricia_tree = "0.6"
quick-xml = "0.38"
rand = "0.8.5"
# resvg 0.46 bumps MSRV to 1.87; cap below it.
resvg = { version = ">=0.45, <0.46", default-features = false }
# MSRV policy is "latest stable at release"; 0.37 compile-verified on 1.83.
# `bundled` avoids a system libsqlite3 dependency.
rusqlite = { version = ">=0.37, <0.38", features = ["bundled"] }
rust-embed = "8.5.0"
serde = {version = "1.0.217", features = ["serde_derive"]}
serde_json = "1.0"
shell-escape = "0.1.5"
tar = "0.4.44"
tempfile = "3.15.0"
time = {version = "0.3.37", features = ["formatting"]}
tokio = { version = "1.43.0", features = ["full"] }
toml = "0.7.8"
# freedesktop trash (native FS backend, no DBus). 5.2 bumps MSRV to 1.85; cap below it.
trash = ">=5.1.1, <5.2"
# same minor as ab_glyph's owned_ttf_parser so only one copy is built.
ttf-parser = "0.25"
unicode-display-width = "0.3.0"
unix_mode = "0.1.4"
users = "0.11.0"
walkdir = "2.5.0"
whoami = "1.5.2"
x509-parser = "0.18"
# zip 8.0 bumps MSRV to 1.88; cap below it.
zip = { version = ">=7.2, <8", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false

[profile.release]
codegen-units = 1
lto = true

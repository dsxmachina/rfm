# --- General behaviour of rfm
[general]
# If set to 'true' (the default), rfm does not delete files instantly but moves
# them to the freedesktop.org trash (~/.local/share/Trash, plus a per-device
# trash on other mounts). Browse it with the 'gT' key; press 'r' there to
# restore an item to its original location. Trashed files also show up in your
# desktop's normal trash (Nautilus, gio, trash-cli) and vice versa.
#
# The freedesktop trash lives on the same disk as each deleted file, so deleting
# stays a cheap rename even across multiple disks (no expensive cross-disk copy).
#
# This flag also determines whether a deletion can be undone (see 'undo'/'redo'):
#   - use_trash = true  : delete moves to the trash and IS undoable ('u').
#   - use_trash = false : delete is permanent and canNOT be undone. It is
#                         recorded as a barrier that stops the undo history
#                         (undo will not revert operations from before it).
#
# The undo stack itself lives only for the current session (it is not persisted);
# the trash, however, is persistent.
#
use_trash = true

# Persist image/video preview thumbnails on disk so they survive restarts:
#   - preview_cache = true  : persist image/video preview thumbnails in
#     $XDG_CACHE_HOME/rfm (usually ~/.cache/rfm) so they survive restarts.
#   - preview_cache = false : previews stay in-memory only; nothing about
#     your files is written to disk. "rm -rf ~/.cache/rfm" is always safe.
preview_cache = true

# Use Nerd Font icons for file types.
#
# When enabled, rfm will use icons from the Nerd Fonts project (like yazi does).
# This requires your terminal to be configured with a Nerd Font
# (e.g., "Hack Nerd Font", "FiraCode Nerd Font", "JetBrainsMono Nerd Font").
#
# Nerd Fonts can be downloaded from: https://www.nerdfonts.com/
#
# When disabled (default), rfm uses standard Unicode symbols that work in any terminal.
#
fancy_icons = false

# --- Color configuration
#
# For normal text, rfm uses the foreground and background color of your terminal.
# Apart from that, there are only four colors in use, which can be configured to any
# of the 16 base colors, that are available for all terminals.
#
# Available options are:
# 
# black    , dark-red, dark-green, dark-yellow, dark-blue, dark-magenta, dark-cyan, grey
# dark-grey,      red,      green,      yellow,      blue,      magenta,      cyan, white
#
#
[colors]
# the 'main' color is used for things like the borders, directory names, and the cursor
main = "dark-green"

# color of 'marked' items
marked = "dark-yellow"

# the 'highlight' color is used to highlight search results, or in the creation of new items
highlight = "red"

# color of the top-row directory path
dir_path = "dark-blue"

# --- Mime-type styles configuration
#
# Configure colors and symbols for files based on their mime-type.
# Each section is named after a mime-type (e.g., "image", "text/markdown").
# You can specify 'color' and/or 'symbol' for each mime-type.
#
# Mime-type matching:
#   - Exact match is tried first (e.g., "text/markdown")
#   - Then type prefix is tried (e.g., "image" matches all image/* types)
#
# Default colors (yazi-like, if not overridden):
#   - image/*        : magenta
#   - audio/*        : cyan
#   - video/*        : yellow
#   - archives       : yellow (zip, tar, gz, 7z, rar)
#   - application/pdf: red
#   - text/markdown  : white
#   - text/x-toml    : dark-yellow
#   - application/json: yellow
#   - yaml           : dark-cyan
#   - xml            : yellow
#   - (other files)  : grey
#
# Example configurations (uncomment to use):
#
# [styles.image]
# color = "cyan"
#
# [styles.audio]
# color = "magenta"
#
# [styles."text/markdown"]
# color = "blue"
# symbol = ""
#
# [styles."application/json"]
# color = "dark-yellow"
# symbol = "{}"
